<!DOCTYPE html>
<html>
<head>
<style>
a:hover {
        text-decoration: none;
        font-size: 32px;
        font-style: normal;
        color: blue;
        height: 1;
        width: 1;
        word-spacing: 1px;
        transition: tansformation 0.25ms
}
</style>
</head>
<body>

<h1>Demo of :hover</h1>

<p>The :hover pseudo-class style links on mouse-over:</p>

<a href="https://www.w3schools.com">w3schools.com</a>
<a href="https://www.wikipedia.org">wikipedia.org</a>

</body>
</html>
